<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRACE — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div class="bg-glow" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<div class="landing" style="grid-template-columns: 1fr; justify-items: center;">
  <div class="landing-auth">
    <div class="auth-card">
      <div class="auth-brand" style="justify-content:center; margin-bottom: 22px;">
        <span class="brand-mark">◈</span>
        <span class="brand-name">TRACE</span>
      </div>

      <form id="resetForm" class="auth-form" style="display:flex;">
        <label>New password</label>
        <input type="password" id="newPassword" required autocomplete="new-password" minlength="6">
        <p class="auth-hint">At least 6 characters</p>
        <p class="auth-error" id="resetError"></p>
        <p class="auth-hint" id="resetSuccess" style="color: var(--green); display:none;">Password updated — you can sign in now.</p>
        <button type="submit" class="btn-primary auth-submit">Set new password</button>
      </form>
    </div>
  </div>
</div>

<script>
const TOKEN = {{ token|tojson }};
const form = document.getElementById("resetForm");
const errEl = document.getElementById("resetError");
const successEl = document.getElementById("resetSuccess");

form.addEventListener("submit", async e => {
  e.preventDefault();
  errEl.textContent = "";
  if (!TOKEN) { errEl.textContent = "Missing or invalid reset link."; return; }
  try {
    const res = await fetch("/api/reset-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, password: document.getElementById("newPassword").value }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || "Could not reset password."; return; }
    successEl.style.display = "block";
    form.querySelector("button").disabled = true;
    setTimeout(() => { window.location.href = "/login"; }, 1800);
  } catch (err) {
    errEl.textContent = "Something went wrong. Try again.";
  }
});
</script>
</body>
</html>
